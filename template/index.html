
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f7fb;
            color: #222;
        }

        h1 {
            color: #174ea6;
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000012;
        }

        button {
            padding: 10px 15px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
            background: #174ea6;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0d3475;
        }

        input {
            padding: 10px;
            width: 90%;
            max-width: 350px;
            margin: 8px 0;
        }

        #result, #customResult {
            margin-top: 15px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <h1>Student API Interface</h1>

    <section class="card">
        <h2>Student Information</h2>
        <button onclick="loadStudent()">
            Load Student Information
        </button>
        <div id="result" aria-live="polite"></div>
    </section>

    <section class="card">
        <h2>Greeting API</h2>
        <input
            type="text"
            id="nameInput"
            placeholder="Enter your first name"
        >
        <br>
        <button onclick="sayHello()">Say Hello</button>
        <p id="greeting" aria-live="polite"></p>
    </section>

    <section class="card">
        <h2>Custom API Endpoint</h2>
        <p>Example: retrieve a message from your custom API.</p>
        <button onclick="loadCustom()">Load Custom Data</button>
        <div id="customResult" aria-live="polite"></div>
    </section>

    <script>
        async function loadStudent() {
            const result = document.getElementById("result");
            result.textContent = "Loading student information...";

            try {
                const response = await fetch("/student");

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                const data = await response.json();

                result.replaceChildren();

                const fields = [
                    ["Student ID", data.student_id],
                    ["Name", data.name],
                    ["Program", data.program],
                    ["Year", data.year],
                    ["Section", data.section]
                ];

                fields.forEach(([label, value]) => {
                    const p = document.createElement("p");
                    const strong = document.createElement("strong");
                    strong.textContent = label + ": ";
                    p.append(strong, document.createTextNode(
                        value ?? "Not provided"
                    ));
                    result.appendChild(p);
                });
            } catch (error) {
                result.textContent = "Unable to retrieve student data.";
            }
        }

        async function sayHello() {
            const name = document.getElementById("nameInput").value.trim();
            const greeting = document.getElementById("greeting");

            greeting.textContent = "Loading greeting...";

            try {
                const response = await fetch(
                    "/hello?name=" + encodeURIComponent(name || "Student")
                );

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                const data = await response.json();
                greeting.textContent = data.message;
            } catch (error) {
                greeting.textContent = "Unable to retrieve greeting.";
            }
        }

        async function loadCustom() {
            const output = document.getElementById("customResult");
            output.textContent = "Loading custom data...";

            try {
                // Replace /custom with your actual Activity 4 endpoint.
                const response = await fetch("/custom");

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent =
                    "Unable to retrieve custom data. Check your endpoint.";
            }
        }
    </script>
</body>
</html>
